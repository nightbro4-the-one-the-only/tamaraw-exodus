name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Prepare site directory
        run: |
          mkdir -p site
          cd "Roleplay application"
          cp -r index.html story.html lore.html rp.html author.html gm.html app.js styles.css chapters.js DISCORD-GUIDE.md README.md ../site/
          cp -r assets ../site/
          touch ../site/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
