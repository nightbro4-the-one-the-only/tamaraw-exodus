name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cd "$GITHUB_WORKSPACE/Roleplay application"
          cp index.html story.html lore.html rp.html author.html gm.html app.js styles.css chapters.js DISCORD-GUIDE.md README.md "$GITHUB_WORKSPACE/_site/"
          cp -r assets "$GITHUB_WORKSPACE/_site/"
          touch "$GITHUB_WORKSPACE/_site/.nojekyll"
          echo "Files in _site:"
          ls "$GITHUB_WORKSPACE/_site/"

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
